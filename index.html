<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>乡音探事</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{
  background:#1b1410;
  color:#efe3cf;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(184,115,74,0.12), transparent 26%),
    radial-gradient(circle at 80% 80%, rgba(62,82,64,0.18), transparent 28%);
}
.container{max-width:1140px;margin:0 auto;padding:24px}
/* ========== 全局导航栏 ========== */
.nav-wrap{
  position:sticky;top:0;z-index:99;
  background:rgba(24,18,14,0.94);
  border-bottom:1px solid rgba(212,175,55,0.22);
  padding:16px 20px;
}
.nav-inner{
  max-width:1140px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;
}
.nav-btn{
  padding:10px 16px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#8a5a3b,#6b3f24);
  color:#fff3cf;font-size:15px;letter-spacing:1px;
  border:1px solid rgba(243,217,138,0.25);
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:.2s;
}
.nav-btn:hover{filter:brightness(1.12)}
.nav-btn:disabled{background:#3a3029;color:#8a7a66;cursor:not-allowed;filter:none}
.nav-btn.main{
  padding:14px 28px;font-size:18px;
  background:linear-gradient(180deg,#b8734a,#f3d98a);
  color:#241a14;font-weight:bold;
  box-shadow:0 0 18px rgba(243,217,138,0.35);
}
.nav-btn.placeholder{
  background:#332b24;color:#92846c;
}
/* 右上角证件小按钮 */
.cert-quick{
  position:fixed;top:14px;right:16px;z-index:100;
  width:42px;height:42px;border-radius:50%;
  border:1px solid rgba(243,217,138,0.4);
  background:rgba(30,22,18,0.85);
  color:#f3d98a;display:grid;place-items:center;
  cursor:pointer;font-size:20px;
}
/* ========== 首页样式 ========== */
.home-page{
  min-height:calc(100vh - 100px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;text-align:center;
}
.home-title{font-size:36px;color:#f3d98a;margin-bottom:12px;letter-spacing:4px}
.home-slogan{font-size:18px;color:#d9c79c;margin-bottom:8px}
.home-desc{max-width:620px;color:#b8a884;margin-top:24px;line-height:1.8}
/* ========== 案件目录页 ========== */
.case-dir{display:grid;grid-template-columns:1fr 220px;gap:20px;margin-top:20px}
.case-list{display:flex;flex-direction:column;gap:14px}
.case-item{
  padding:18px;border:1px solid rgba(243,217,138,0.22);
  border-radius:12px;background:rgba(44,32,24,0.55);
  cursor:pointer;transition:0.25s;
}
.case-item:hover{background:rgba(60,44,32,0.65)}
.case-item.locked{opacity:0.45;cursor:not-allowed}
.case-title{color:#ffd98b;font-size:17px;margin-bottom:6px}
.case-sub{color:#c9b890;font-size:14px}
.side-col{display:flex;flex-direction:column;gap:12px}
.side-btn{
  padding:14px;border:1px dashed rgba(243,217,138,0.3);
  border-radius:10px;background:rgba(44,32,24,0.45);
  cursor:pointer;color:#e8d7a9;text-align:center;
}
/* ========== 通用面板 ========== */
.panel{
  background:rgba(30,22,18,0.72);
  border:1px solid rgba(212,175,55,0.22);
  border-radius:16px;padding:24px;margin-top:20px;
  box-shadow:0 16px 40px rgba(0,0,0,0.45);
}
.panel-title{
  font-size:20px;color:#f3d98a;margin-bottom:16px;
  padding-left:12px;border-left:4px solid #b8734a;
}
/* ========== 场景页面｜对话样式 ========== */
.scene{min-height:460px;position:relative}
.scene-title{
  font-size:20px;color:#f3d98a;margin-bottom:14px;
  padding-left:12px;border-left:4px solid #b8734a;
}
.dialog-wrap{
  margin-bottom:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.dialog-item{
  padding:12px 14px;
  border-radius:10px;
  max-width:90%;
  line-height:1.7;
}
.dialog-a{
  background:rgba(100,70,48,0.45);
  align-self:flex-start;
  border-left:3px solid #b8734a;
}
.dialog-b{
  background:rgba(60,75,60,0.45);
  align-self:flex-end;
  border-right:3px solid #729974;
  text-align:right;
}
.dialog-name{
  color:#f3d98a;font-weight:bold;margin-bottom:4px;
}
.lan-word{
  color:#ffd98b;cursor:pointer;text-decoration:underline dotted;
}
.opt-ask{
  padding:11px;border:1px solid rgba(243,217,138,0.2);
  border-radius:10px;margin:8px 0;cursor:pointer;
  background:rgba(52,38,28,0.45);transition:0.2s;
}
.opt-ask:hover{background:rgba(70,50,36,0.55)}
.nav-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{
  padding:10px 18px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#8a5a3b,#6b3f24);
  color:#fff3cf;font-size:15px;letter-spacing:1px;
  border:1px solid rgba(243,217,138,0.25);
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:.2s;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{background:#3a3029;color:#8a7a66;cursor:not-allowed;filter:none}
.btn-secondary{background:linear-gradient(180deg,#3e5240,#253328)}
.foot-tip{margin-top:10px;font-size:13px;color:#a89778}
/* ========== 词库页面 ========== */
.word-item{
  padding:12px;border-bottom:1px dashed rgba(243,217,138,0.12);
  line-height:1.65;color:#efe3cf;
}
.word-item.locked{color:#776b58}
.word-title{color:#ffd98b;font-weight:bold}
/* ========== 商店页面 ========== */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:12px}
.shop-card{
  border:1px solid rgba(243,217,138,0.2);border-radius:10px;padding:14px;
  background:rgba(44,32,24,0.45);
}
.shop-card h4{color:#ffd98b;margin-bottom:6px}
.shop-cost{color:#d4b888;font-size:14px}
/* ========== 弹窗｜考题、闽南词释义弹窗 ========== */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.modal.open{display:flex}
.modal-box{
  background:rgba(30,22,18,0.92);
  border:1px solid rgba(243,217,138,0.3);
  border-radius:16px;width:92%;max-width:580px;padding:24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.55);
}
.modal-title{font-size:18px;color:#f3d98a;margin-bottom:14px}
.opt-item{
  padding:12px;border:1px solid rgba(243,217,138,0.18);
  border-radius:10px;margin:10px 0;cursor:pointer;background:rgba(60,42,30,0.45);
  color:#efe3cf;transition:.2s;
}
.opt-item:hover{background:rgba(80,56,40,0.55)}
.opt-item.correct{background:rgba(102,187,106,0.18);border-color:#66bb6a;color:#d7ffd7}
.opt-item.wrong{background:rgba(239,108,108,0.18);border-color:#ef6c6c;color:#ffd6d6}
.tip-text{margin:12px 0;line-height:1.75;color:#e3d2a7}
/* ========== 证书页面 ========== */
.cert{
  border:2px solid #f3d98a;border-radius:16px;padding:26px;text-align:center;
  background:
    radial-gradient(circle at 50% 50%, rgba(243,217,138,0.08), transparent 70%),
    linear-gradient(180deg,#3a2a1e,#241a14);
  box-shadow:0 18px 45px rgba(0,0,0,0.45);
}
.cert.stamp-1{border-color:#e2bc72}
.cert.stamp-2{border-color:#c29650}
.cert h2{color:#f3d98a;margin-bottom:14px}
.cert-stamp{
  margin:18px auto;width:110px;height:110px;border:3px solid #f3d98a;
  border-radius:50%;display:grid;place-items:center;font-weight:bold;color:#f3d98a;
  rotate:-12deg;font-size:14px;line-height:1.4;
  background:rgba(243,217,138,0.06);
}
.cert-stamp.s1{border-color:#e2bc72;color:#e2bc72}
.cert-stamp.s2{border-color:#c29650;color:#c29650}
.cert p{line-height:1.85;color:#efe3cf;margin:10px 0}
input{
  padding:8px 12px;border-radius:8px;border:1px solid rgba(243,217,138,0.3);
  background:rgba(60,42,30,0.45);color:#efe3cf;outline:none;
}
.score-bar{display:flex;gap:24px;margin-bottom:12px;color:#e8d7a9}
</style>
</head>
<body>
<div class="nav-wrap">
  <div class="nav-inner">
    <button class="nav-btn" id="btnShop">商店</button>
    <button class="nav-btn" id="btnWord">词库</button>
    <button class="nav-btn main" id="btnStart">开始调查</button>
    <button class="nav-btn" id="btnPaper">卷宗</button>
    <button class="nav-btn placeholder" id="btnUnlock">未解锁</button>
  </div>
</div>
<div class="cert-quick" id="btnCert">📜</div>
<div class="container" id="app"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="mTitle"></div>
    <div id="mBody"></div>
    <div class="nav-row" id="mNav"></div>
  </div>
</div>

<script>
const SAVE_KEY = "xiangyin_save_v6";
const state = {
  page:"home",
  //案件1：魔神仔传闻
  case1:{scene:0,clues:Array(6).fill(false),wrongCount:0,done:false},
  scoreCase:0,
  scoreStudy:0,
  certStamp:"default",
  certBorder:"default",
  certFont:"default",
  ownedStamp:["default"],
  ownedBorder:["default"],
  ownedFont:["default"],
  playerName:"",
  sideStoryDone:[]
};
//第一章案件场景：0杂货店，1龙眼林，2礁石，3卷宗
const case1Scenes = [
  {
    title:"第一章｜杂货店 · 后埕村",
    dialog:[
      {who:"旁白",txt:"后埕村杂货店，阿伯坐在柜台剥花生，收音机缓缓播放南音。你走上前打招呼。"},
      {who:"阿伯",txt:"<span class='lan-word' data-w='2'>汝讲啥？</span>"},
      {who:"阿伯",txt:"无啦，<span class='lan-word' data-w='3'>无代志</span>。"}
    ],
    asks:[
      {txt:"阿伯，<span class='lan-word' data-w='4'>昨昏暗时</span>发生啥物代志？",correct:true,reply:"昨昏暗时，我咧关店，听着有人咧叫名。叫三声，第三声近近咧。我开门看，无半个人。",clueIdx:0},
      {txt:"恁遮敢有<span class='lan-word' data-w='0'>魔神仔</span>？",correct:false,reply:"阿伯眉头一皱，闭口不再说话。"},
      {txt:"这包薰偌济钱？",correct:false,reply:"阿伯随口报了价钱，和传闻无关。"}
    ],
    followUp:{
      q:"是<span class='lan-word' data-w='6'>查埔声</span>抑是<span class='lan-word' data-w='7'>查某声</span>？",
      reply:"查某声。老老的。",
      clueIdx:1
    },
    nav:[{txt:"前往龙眼林",next:1}],
    tip:"试着用当地的问话，才可以撬开阿伯的话匣子。"
  },
  {
    title:"第一章｜龙眼林 · 后埕村",
    dialog:[{who:"旁白",txt:"龙眼树下，阿弟蹲在地上玩石子，神色怕生。"}],
    asks:[
      {txt:"阿弟，<span class='lan-word' data-w='10'>汝敢有看着</span>人？",correct:true,reply:"有一个<span class='lan-word' data-w='8'>细细汉</span>的，<span class='lan-word' data-w='1'>暗时</span>伫<span class='lan-word' data-w='9'>树仔跤</span>。",clueIdx:2},
      {txt:"你有没有看见鬼怪？",correct:false,reply:"阿弟害怕地摇摇头，不肯多说话。"}
    ],
    followUp:{
      q:"伊<span class='lan-word' data-w='11'>敢会</span>讲话？",
      reply:"无讲话，<span class='lan-word' data-w='12'>干焦</span>狗仔<span class='lan-word' data-w='13'>缀</span>伊行。",
      clueIdx:3
    },
    nav:[{txt:"前往礁石",next:2}],
    tip:"先获取杂货店叫名口述，礁石才可以交互。"
  },
  {
    title:"第一章｜礁石 · 后埕村",
    dialog:[{who:"旁白",txt:"夜里海风呼啸，礁石上一盏孤灯摇曳，一位阿嬷背对着你。需要使用合适的闽南话语才可以搭话。"}],
    asks:[
      {txt:"阿嬷，<span class='lan-word' data-w='1'>暗时</span>风大。",correct:true,reply:"<div>「<span class='lan-word' data-w='14'>阿明啊——<span class='lan-word' data-w='15'>转来</span>食饭喔——</span>」<br>「<span class='lan-word' data-w='16'>三冬</span>矣。我叫三冬矣，伊犹原无应。」<br>「日时<span class='lan-word' data-w='17'>袂使</span>叫，人会议论。」</div>",clueIdx:4},
      {txt:"这里是不是有魔神仔？",correct:false,reply:"阿嬷充耳不闻，不理睬你。"}
    ],
    followUp:{q:"为何夜里在此呼喊？",reply:"灯照着，伊较看会着路。",clueIdx:5},
    nav:[{txt:"打开卷宗汇报",next:3}],
    tip:"听阿嬷的独白，拼凑整件传闻真相。"
  },
  {
    title:"第一章｜卷宗汇报 · 后埕村案件",
    dialog:[],asks:[],nav:[],tip:"整理全部线索，选择关键词与结案结论提交审核。"
  }
];
//本案12词
const case1WordList = [
  {idx:0,text:"魔神仔｜môo‑sîn‑á｜传说矮小精怪"},
  {idx:1,text:"暗时｜àm‑sî｜夜里"},
  {idx:2,text:"汝讲啥｜lú kóng siánn｜你说什么"},
  {idx:3,text:"无代志｜bô tāi‑tsì｜没事啦"},
  {idx:4,text:"昨昏暗时｜tsa‑hng àm‑sî｜昨天夜里"},
  {idx:5,text:"叫名｜kiò‑miâ｜喊名字"},
  {idx:6,text:"查埔声｜tsa‑poo‑siann｜男声"},
  {idx:7,text:"查某声｜tsa‑bóo‑siann｜女声"},
  {idx:8,text:"细细汉｜sè‑sè‑hàn｜个子矮小"},
  {idx:9,text:"树仔跤｜tshiū‑á‑kha｜树下"},
  {idx:10,text:"汝敢有看着｜lú kánn ū khuànn‑tio̍h｜你是否看见"},
  {idx:11,text:"伊敢会｜i kánn ē｜他会不会"},
  {idx:12,text:"干焦｜kan‑ta｜仅仅、只"},
  {idx:13,text:"缀｜tuè｜跟、跟随"},
  {idx:14,text:"阿明｜A‑bîng｜人名阿明"},
  {idx:15,text:"转来｜tńg‑lâi｜回来"},
  {idx:16,text:"三冬｜sann‑tang｜三年"},
  {idx:17,text:"袂使｜bē‑sái｜不可以"}
];
//卷宗11关键词
const paperKeywords = ["阿伯","三声","查某声","阿弟","细细汉","狗仔","礁石","阿嬷","阿明","三冬","魔神仔无影"];
//商店商品定义
const shopItems = [
  {id:"stamp1",type:"stamp",name:"渔火纪念印章",costCase:20,costStudy:10},
  {id:"stamp2",type:"stamp",name:"红头船印章",costCase:30,costStudy:15},
  {id:"border1",type:"border",name:"旧侨批边框",costCase:25,costStudy:12},
  {id:"font1",type:"font",name:"手写落款字体",costCase:15,costStudy:20}
];
const modalEl = document.getElementById("modal");
const mTitle = document.getElementById("mTitle");
const mBody = document.getElementById("mBody");
const mNav = document.getElementById("mNav");
const app = document.getElementById("app");
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw) Object.assign(state,JSON.parse(raw));
}
function openModal(){modalEl.classList.add("open")}
function closeModal(){modalEl.classList.remove("open")}
function render(){
  app.innerHTML = "";
  if(state.page==="home"){
    app.innerHTML = `
      <div class="home-page">
        <div class="home-title">乡音探事</div>
        <div class="home-slogan">一纸侨批，山海乡音</div>
        <div class="home-desc">闽南侨乡研学探案游戏。调查乡间传闻，学习闽南乡音，完成稽查委托。</div>
      </div>
    `;
  }else if(state.page==="casedir"){
    app.innerHTML = `
    <div class="panel">
      <div class="panel-title">案件目录</div>
      <div class="score-bar">
        <div>办案积分：${state.scoreCase}</div>
        <div>研学积分：${state.scoreStudy}</div>
      </div>
      <div class="case-dir">
        <div class="case-list">
          <div class="case-item" id="openCase1">
            <div class="case-title">第一章 · 魔神仔传闻</div>
            <div class="case-sub">后埕村：杂货店｜龙眼林｜礁石｜卷宗汇报 ${state.case1.done?"✅已结案":"🟡未结案"}</div>
          </div>
          <div class="case-item locked">
            <div class="case-title">第二章 · （待开放）</div>
            <div class="case-sub">全新独立案件，后续更新</div>
          </div>
        </div>
        <div class="side-col">
          <div class="side-btn" id="openSide">📖 支线小故事</div>
        </div>
      </div>
    </div>`;
    app.querySelector("#openCase1").onclick = ()=>{
      state.page="case1";state.case1.scene=0;save();render();
    };
    app.querySelector("#openSide").onclick = ()=>{
      alert("支线小故事模块开发中。");
    }
  }else if(state.page==="case1"){
    const s = case1Scenes[state.case1.scene];
    let html = `<div class="panel scene"><div class="scene-title">${s.title}</div>`;
    html += `<div class="dialog-wrap">`;
    s.dialog.forEach(d=>{
      const cls = d.who==="你"?"dialog-b":"dialog-a";
      html += `<div class="dialog-item ${cls}"><div class="dialog-name">${d.who}</div><div>${d.txt}</div></div>`;
    })
    html += `</div>`;
    if(s.asks && s.asks.length>0){
      html += `<div><h4 style="color:#f3d98a;margin:8px 0">选择你的问话</h4>`;
      s.asks.forEach((ak,idx)=>{
        html += `<div class="opt-ask" data-ask="${idx}">${ak.txt}</div>`
      })
      html += `</div>`;
    }
    html += `<div class="nav-row">`;
    if(s.nav){
      s.nav.forEach(n=>{
        if(n.next===3){
          const ok = state.case1.clues.filter(x=>x).length>=6;
          html += `<button class="btn" ${ok?"":"disabled"} data-next="${n.next}">${n.txt}</button>`;
        }else{
          html += `<button class="btn" data-next="${n.next}">${n.txt}</button>`;
        }
      })
    }
    html += `<button class="btn btn-secondary" id="backDir">返回案件目录</button>`;
    html += `</div>`;
    if(s.tip) html += `<div class="foot-tip">💡提示：${s.tip}</div>`;
    html += `</div>`;
    app.innerHTML = html;
    //闽南词点击 +1研学积分
    document.querySelectorAll(".lan-word").forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const wid = Number(el.dataset.w);
        const w = case1WordList[wid];
        state.scoreStudy+=1;save();
        mTitle.innerText="闽南词释义";
        mBody.innerHTML=`<div class="tip-text">${w.text}</div>`;
        mNav.innerHTML=`<button class="btn" id="closeLan">关闭</button>`;
        openModal();
        document.getElementById("closeLan").onclick=closeModal;
        render();
      }
    })
    //问话点击
    document.querySelectorAll(".opt-ask").forEach(el=>{
      el.onclick=()=>{
        const aidx=Number(el.dataset.ask);
        const ak = s.asks[aidx];
        mTitle.innerText:"对话反馈";
        mBody.innerHTML=`<div class="tip-text">${ak.reply}</div>`;
        mNav.innerHTML=`<button class="btn" id="closeAsk">确定</button>`;
        openModal();
        document.getElementById("closeAsk").onclick=()=>{
          closeModal();
          if(ak.correct && ak.clueIdx!==undefined && !state.case1.clues[ak.clueIdx]){
            state.case1.clues[ak.clueIdx]=true;
            state.scoreCase +=3;
            save();render();
          }
        }
      }
    })
    document.querySelectorAll("[data-next]").forEach(el=>{
      el.onclick=()=>{
        const v=Number(el.dataset.next);
        if(v===3){openPaperCase1()}else{state.case1.scene=v;save();render();}
      }
    })
    document.getElementById("backDir").onclick=()=>{state.page="casedir";save();render();}
  }else if(state.page==="word"){
    let html = `<div class="panel"><div class="panel-title">词库｜闽南乡音</div>`;
    case1WordList.forEach(w=>{
      html += `<div class="word-item"><div class="word-title">${w.text}</div></div>`;
    })
    html += `</div>`;
    app.innerHTML = html;
  }else if(state.page==="shop"){
    let html = `<div class="panel">
      <div class="panel-title">商店｜证件装扮兑换</div>
      <div class="score-bar"><div>办案积分：${state.scoreCase}</div><div>研学积分：${state.scoreStudy}</div></div>
      <div class="shop-grid">`;
    shopItems.forEach(it=>{
      const owned = (it.type==="stamp"?state.ownedStamp:it.type==="border"?state.ownedBorder:state.ownedFont).includes(it.id);
      html += `<div class="shop-card">
        <h4>${it.name}</h4>
        <div class="shop-cost">办案积分${it.costCase} / 研学积分${it.costStudy}</div>
        ${owned?"<div style='color:#89d989'>✅已拥有</div>":`<button class="btn buy-btn" data-id="${it.id}">兑换</button>`}
      </div>`;
    })
    html += `</div></div>`;
    app.innerHTML = html;
    document.querySelectorAll(".buy-btn").forEach(el=>{
      el.onclick=()=>{
        const it = shopItems.find(x=>x.id===el.dataset.id);
        if(state.scoreCase>=it.costCase || state.scoreStudy>=it.costStudy){
          if(state.scoreCase>=it.costCase) state.scoreCase -= it.costCase;
          else state.scoreStudy -= it.costStudy;
          if(it.type==="stamp") state.ownedStamp.push(it.id);
          if(it.type==="border") state.ownedBorder.push(it.id);
          if(it.type==="font") state.ownedFont.push(it.id);
          save();render();alert("兑换成功，可在稽查员证切换样式");
        }else{alert("积分不足");}
      }
    })
  }else if(state.page==="certview"){
    let clsExtra = "";
    if(state.certStamp==="stamp1") clsExtra+=" stamp-1";
    if(state.certStamp==="stamp2") clsExtra+=" stamp-2";
    app.innerHTML = `
    <div class="panel cert${clsExtra}">
      <h2>🏅 乡音探事 · 见习稽查员证</h2>
      <div style="margin:14px 0">稽查员：<input id="nameInput" value="${state.playerName}" placeholder="填写名字"></div>
      <div class="cert-stamp ${state.certStamp}">南音馆<br>稽查组</div>
      <p>完成案件调查，研习闽南乡音。</p>
      <div class="nav-row" style="justify-content:center">
        <button class="btn" id="saveCertName">保存名字</button>
        <button class="btn btn-secondary" id="closeCertView">关闭</button>
      </div>
    </div>`;
    document.getElementById("saveCertName").onclick=()=>{
      state.playerName = document.getElementById("nameInput").value;save();alert("已保存");
    }
    document.getElementById("closeCertView").onclick=()=>{state.page="home";save();render();}
  }
}
function openPaperCase1(){
  state.case1.wrongCount = 0;
  mTitle.innerText="第一章｜卷宗汇报";
  let kwHtml = "";
  paperKeywords.forEach((kw,i)=>{
    kwHtml += `<div class="opt-item" data-kw="${i}">☐ ${kw}</div>`;
  })
  mBody.innerHTML = `<div class="tip-text">勾选收集到的关键词。规则：>=9个且包含「魔神仔无影」为地道；第3次及以后重试阈值降到6。<br>选择结案结语：</div>
  ${kwHtml}
  <div class="opt-item" data-conc="0">地道：魔神仔是无影的</div>
  <div class="opt-item" data-conc="1">通过：魔神仔是假的</div>
  <div class="opt-item" data-conc="2">无加分：没有魔神仔</div>`;
  mNav.innerHTML = `<button class="btn" id="submitPaper1">提交卷宗</button><button class="btn btn-secondary" id="closePaper1">取消</button>`;
  openModal();
  let selKw = new Set();
  let selConc = null;
  document.querySelectorAll("[data-kw]").forEach(el=>{
    el.onclick=()=>{
      const k = Number(el.dataset.kw);
      if(selKw.has(k)){selKw.delete(k);el.innerText="☐ "+paperKeywords[k];}
      else {selKw.add(k);el.innerText="☑ "+paperKeywords[k];}
    }
  })
  document.querySelectorAll("[data-conc]").forEach(el=>{
    el.onclick=()=>{selConc=Number(el.dataset.conc);document.querySelectorAll("[data-conc]").forEach(e=>e.style.background="");el.style.background="rgba(184,115,74,0.3)";}
  })
  document.getElementById("submitPaper1").onclick=()=>{
    if(selConc===null){alert("请选择结案结语");return;}
    state.case1.wrongCount++;
    const hit = selKw.size;
    const hasCore = selKw.has(paperKeywords.indexOf("魔神仔无影"));
    const thresh = state.case1.wrongCount>=3 ?6:9;
    if(hit>=thresh && hasCore){
      state.case1.done=true;
      state.scoreCase +=40;
      closeModal();alert("✅卷宗审核通过，案件结案，获得见习稽查员证。办案积分+40");
      state.page="certview";save();render();
    }else{
      let tip="";
      if(state.case1.wrongCount===1){tip:"推论不足。需要命中足够关键词，并且必须包含「魔神仔无影」。";}
      else if(state.case1.wrongCount===2){tip:"回顾线索：阿伯的叫声、阿弟看到的黑影、礁石阿嬷的独白。";}
      else{tip:"💡放宽阈值至6个关键词，依旧必须包含「魔神仔无影」。"}
      mBody.innerHTML=`<div class="tip-text">${tip}</div>`;
    }
    save();
  }
  document.getElementById("closePaper1").onclick=closeModal;
}
//导航按钮
document.getElementById("btnShop").onclick=()=>{state.page="shop";save();render();};
document.getElementById("btnWord").onclick=()=>{state.page="word";save();render();};
document.getElementById("btnStart").onclick=()=>{state.page="casedir";save();render();};
document.getElementById("btnPaper").onclick=()=>alert("卷宗请进入对应案件内部打开。");
document.getElementById("btnUnlock").onclick=()=>alert("未解锁功能开发中。");
document.getElementById("btnCert").onclick=()=>{state.page="certview";save();render();};

load();render();
</script>

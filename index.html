<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>乡音探事</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
body{
  background:#1b1410;
  color:#efe3cf;
  overflow-x:hidden;
  background-image:
    radial-gradient(circle at 20% 10%, rgba(184,115,74,0.12), transparent 26%),
    radial-gradient(circle at 80% 80%, rgba(62,82,64,0.18), transparent 28%);
}
.container{max-width:1140px;margin:0 auto;padding:24px}
/* ========== 全局导航栏 ========== */
.nav-wrap{
  position:sticky;top:0;z-index:99;
  background:rgba(24,18,14,0.94);
  border-bottom:1px solid rgba(212,175,55,0.22);
  padding:16px 20px;
}
.nav-inner{
  max-width:1140px;margin:0 auto;
  display:flex;align-items:center;justify-content:center;gap:14px;
  flex-wrap:wrap;
}
.nav-btn{
  padding:10px 16px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#8a5a3b,#6b3f24);
  color:#fff3cf;font-size:15px;letter-spacing:1px;
  border:1px solid rgba(243,217,138,0.25);
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:.2s;
}
.nav-btn:hover{filter:brightness(1.12)}
.nav-btn:disabled{background:#3a3029;color:#8a7a66;cursor:not-allowed;filter:none}
.nav-btn.main{
  padding:14px 28px;font-size:18px;
  background:linear-gradient(180deg,#b8734a,#f3d98a);
  color:#241a14;font-weight:bold;
  box-shadow:0 0 18px rgba(243,217,138,0.35);
}
.nav-btn.placeholder{
  background:#332b24;color:#92846c;
}
/* ========== 首页样式 ========== */
.home-page{
  min-height:calc(100vh - 100px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px 20px;text-align:center;
}
.home-title{font-size:36px;color:#f3d98a;margin-bottom:12px;letter-spacing:4px}
.home-slogan{font-size:18px;color:#d9c79c;margin-bottom:8px}
.home-desc{max-width:620px;color:#b8a884;margin-top:24px;line-height:1.8}
/* ========== 通用面板 ========== */
.panel{
  background:rgba(30,22,18,0.72);
  border:1px solid rgba(212,175,55,0.22);
  border-radius:16px;padding:24px;margin-top:20px;
  box-shadow:0 16px 40px rgba(0,0,0,0.45);
}
.panel-title{
  font-size:20px;color:#f3d98a;margin-bottom:16px;
  padding-left:12px;border-left:4px solid #b8734a;
}
/* ========== 场景页面 ========== */
.scene{min-height:460px;position:relative}
.scene-title{
  font-size:20px;color:#f3d98a;margin-bottom:14px;
  padding-left:12px;border-left:4px solid #b8734a;
}
.scene-desc{margin-bottom:22px;line-height:1.75;color:#e3d2a7}
.point-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:22px}
.point-item{
  border:1px solid rgba(243,217,138,0.2);border-radius:12px;padding:14px;cursor:pointer;
  background:rgba(60,42,30,0.45);transition:.25s;position:relative;overflow:hidden;
}
.point-item::before{
  content:"";position:absolute;left:0;top:0;width:4px;height:100%;
  background:#b8734a;transform:scaleY(0);transform-origin:top;transition:.3s;
}
.point-item:hover{background:rgba(80,56,40,0.55);transform:translateY(-2px)}
.point-item:hover::before{transform:scaleY(1)}
.point-item.locked{opacity:.55}
.point-name{font-weight:bold;margin-bottom:6px;color:#ffd98b}
.point-text{color:#d9c79c;font-size:14px}
.nav-row{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{
  padding:10px 18px;border:none;border-radius:10px;cursor:pointer;
  background:linear-gradient(180deg,#8a5a3b,#6b3f24);
  color:#fff3cf;font-size:15px;letter-spacing:1px;
  border:1px solid rgba(243,217,138,0.25);
  box-shadow:0 8px 20px rgba(0,0,0,0.35);
  transition:.2s;
}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{background:#3a3029;color:#8a7a66;cursor:not-allowed;filter:none}
.btn-secondary{background:linear-gradient(180deg,#3e5240,#253328)}
.foot-tip{margin-top:10px;font-size:13px;color:#a89778}
.help-btn{position:absolute;bottom:18px;right:18px}
/* ========== 词库页面 ========== */
.word-item{
  padding:12px;border-bottom:1px dashed rgba(243,217,138,0.12);
  line-height:1.65;color:#efe3cf;
}
.word-item.locked{color:#776b58}
.word-title{color:#ffd98b;font-weight:bold}
/* ========== 未解锁面板 ========== */
.unlock-group{margin-bottom:18px}
.unlock-group h4{color:#f3d98a;margin-bottom:8px}
.unlock-item{padding:8px 0;color:#d9c79c}
/* ========== 卷宗弹窗 ========== */
.modal{
  position:fixed;inset:0;background:rgba(0,0,0,0.55);
  display:none;align-items:center;justify-content:center;z-index:100;
}
.modal.open{display:flex}
.modal-box{
  background:rgba(30,22,18,0.92);
  border:1px solid rgba(243,217,138,0.3);
  border-radius:16px;width:92%;max-width:540px;padding:24px;
  box-shadow:0 20px 50px rgba(0,0,0,0.55);
}
.modal-title{font-size:18px;color:#f3d98a;margin-bottom:14px}
.opt-item{
  padding:12px;border:1px solid rgba(243,217,138,0.18);
  border-radius:10px;margin:10px 0;cursor:pointer;background:rgba(60,42,30,0.45);
  color:#efe3cf;transition:.2s;
}
.opt-item:hover{background:rgba(80,56,40,0.55)}
.opt-item.correct{background:rgba(102,187,106,0.18);border-color:#66bb6a;color:#d7ffd7}
.opt-item.wrong{background:rgba(239,108,108,0.18);border-color:#ef6c6c;color:#ffd6d6}
.tip-text{margin:12px 0;line-height:1.75;color:#e3d2a7}
/* ========== 证书页面 ========== */
.cert{
  border:2px solid #f3d98a;border-radius:16px;padding:26px;text-align:center;
  background:
    radial-gradient(circle at 50% 50%, rgba(243,217,138,0.08), transparent 70%),
    linear-gradient(180deg,#3a2a1e,#241a14);
  box-shadow:0 18px 45px rgba(0,0,0,0.45);
}
.cert h2{color:#f3d98a;margin-bottom:14px}
.cert-stamp{
  margin:18px auto;width:110px;height:110px;border:3px solid #f3d98a;
  border-radius:50%;display:grid;place-items:center;font-weight:bold;color:#f3d98a;
  rotate:-12deg;font-size:14px;line-height:1.4;
  background:rgba(243,217,138,0.06);
}
.cert p{line-height:1.85;color:#efe3cf;margin:10px 0}
input{
  padding:8px 12px;border-radius:8px;border:1px solid rgba(243,217,138,0.3);
  background:rgba(60,42,30,0.45);color:#efe3cf;outline:none;
}
</style>
</head>
<body>
<div class="nav-wrap">
  <div class="nav-inner">
    <button class="nav-btn placeholder" id="btnShop">商店</button>
    <button class="nav-btn" id="btnWord">词库</button>
    <button class="nav-btn main" id="btnStart">开始调查</button>
    <button class="nav-btn" id="btnPaper">卷宗</button>
    <button class="nav-btn" id="btnUnlock">未解锁</button>
  </div>
</div>
<div class="container" id="app"></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-title" id="mTitle"></div>
    <div id="mBody"></div>
    <div class="nav-row" id="mNav"></div>
  </div>
</div>

<script>
const SAVE_KEY = "xiangyin_save_v4";
const state = {
  page:"home",
  sceneIdx:0,
  clues:Array(8).fill(false),
  wrongCount:0,
  tipCd:0,
  playerName:""
};
const scenes = [
  {
    title:"欢迎来到乡音探事",
    desc:`这片海边侨乡，藏着一段番客的往事。\n所有线索都藏在场景之中，未解锁只会显示“？？？”。\n完成乡音小考题解锁线索，留心线索细节，它们彼此关联。\n探索顺序：杂货店 → 龙眼林 → 礁石滩 → 侨批代书摊\n集齐全部线索，前往卷宗提交推理。`,
    points:[],
    nav:[{txt:"出发探索",next:1}]
  },
  {
    title:"场景一｜杂货店",
    desc:"老木柜台、粗陶罐、竹篮、油灯、抽屉，是侨眷托店主帮忙采买、代收侨批的地方。",
    points:[
      {idx:0,name:"陶罐",q:"陶罐外壁的刻痕，店主用来做什么？",opts:["登记侨眷托买的丝线、灯油等日用货品","标记陶罐烧制年份","祈福画符"],ans:0,clue:"陶罐刻痕：杂货店主用闽南俗字记账，登记一位妇人托买丝线、灯油，等侨批捎来银钱结账。",word:"生理｜seng-lí｜生意、买卖；旧时侨乡把营生叫生理"},
      {idx:1,name:"柜台抽屉",q:"抽屉里的草稿，是侨批最常写的牵挂？",opts:["盼平安，银钱托船客捎回","明日出海，风浪难料","龙眼熟了，等你回来采摘"],ans:0,clue:"抽屉侨批草稿：一位南洋番客写下，盼家人平安，银钱托船客捎回，补贴家用。",word:"厝｜tshù｜家；寄银返厝 = 寄钱回家"}
    ],
    nav:[{txt:"前往龙眼林",next:2}],
    tip:"留意货架上的陶罐与抽屉"
  },
  {
    title:"场景二｜龙眼林",
    desc:"成片老龙眼树、石凳、落叶小路，是侨眷等候船客、打听南洋亲人消息的地方。",
    points:[
      {idx:2,name:"老龙眼树根",q:"闽南短句「阿母，我会好好趁食」是谁在这里相传？",opts:["等候亲人的乡人互相传递平安消息","商人谈生意","孩童童谣"],ans:0,clue:"龙眼树下常有妇人带着孩子久坐，船客上岸后转述南洋番客捎回的平安话。",word:"趁食｜thàn-tsia̍h｜谋生、赚钱；趁食就是出外打拼"}
    ],
    nav:[{txt:"前往礁石滩",next:3}],
    tip:"多留意老树根旁的闲谈"
  },
  {
    title:"场景三｜礁石滩",
    desc:"海浪、黑礁石、旧渔网、贝壳、石码头，红头船从这里出发，也在这里靠岸。",
    points:[
      {idx:3,name:"礁石刻痕",q:"礁石浅浅刻下记号，渔民用来记录？",opts:["潮汐起落，预估归船时间","鱼群位置","游客标记"],ans:0,clue:"渔民在礁石刻痕记录潮汐，潮水合适红头船才能靠岸，家人在此等候归人。",word:"潮｜tiô｜潮水；看潮候，等船归"},
      {idx:4,name:"旧渔网",q:"渔网中半张侨批封，番客大多去往何处趁食？",opts:["南洋（番边）","福州","泉州城内"],ans:0,clue:"侨批寄回唐山故土，寄信人在南洋番边谋生，搭乘红头船跨海传信。",word:"番边｜huan-pinn｜南洋；过番，动身去南洋打拼"}
    ],
    nav:[{txt:"前往侨批代书摊",next:4}],
    tip:"礁石、渔网藏着线索"
  },
  {
    title:"场景四｜侨批代书摊",
    desc:"木摊、毛笔、信笺、信封、算盘；很多番客不识字，请代书先生写侨批，还用暗语记汇款。",
    points:[
      {idx:5,name:"代书先生的信笺",q:"闽南话「囝仔」是什么意思？",opts:["孩子、儿女","稻米","小船"],ans:0,clue:"代书先生常帮南洋番客写信，叮嘱家人照料囝仔，送囝仔读书。",word:"囝仔｜kiáⁿ-á｜小孩；读册就是读书"},
      {idx:6,name:"算盘旁暗语字条",q:"字条写「杉兄」，杉=3，兄=百，代表多少钱？",opts:["三百","三十","三千"],ans:0,clue:"番客和代书先生约定暗语，杉兄代表三百银，外人看不懂，同乡才明白。",word:"糖仔｜thn̂g-á｜侨批暗语代指钱款；写糖仔就是寄钱"},
      {idx:7,name:"摊边歌谣纸片",q:"歌谣「一溪目汁一船人」里的目汁是？",opts:["眼泪","海水","米酒"],ans:0,clue:"阿发当年登船下南洋，妻儿在岸边流泪，侨批承载山海思念。",word:"目汁｜ba̍k-tsi｜眼泪；闽南很有画面感的词"}
    ],
    nav:[{txt:"查看卷宗",next:"paper"}],
    tip:"信笺、算盘、歌谣纸片都可以细看"
  }
];
const wordList = [
  {idx:0,text:"生理｜seng-lí｜生意、买卖；旧时侨乡把营生叫生理"},
  {idx:1,text:"厝｜tshù｜家；寄银返厝 = 寄钱回家"},
  {idx:2,text:"趁食｜thàn-tsia̍h｜谋生、赚钱；趁食就是出外打拼"},
  {idx:3,text:"潮｜tiô｜潮水；看潮候，等船归"},
  {idx:4,text:"番边｜huan-pinn｜南洋；过番，动身去南洋打拼"},
  {idx:5,text:"囝仔｜kiáⁿ-á｜小孩；读册就是读书"},
  {idx:6,text:"糖仔｜thn̂g-á｜侨批暗语代指钱款；写糖仔就是寄钱"},
  {idx:7,text:"目汁｜ba̍k-tsi｜眼泪；闽南很有画面感的词"}
];
const unlockMeta = [
  {type:"clue",idx:0,desc:"陶罐刻痕线索｜杂货店"},
  {type:"clue",idx:1,desc:"侨批草稿线索｜杂货店"},
  {type:"clue",idx:2,desc:"龙眼树下平安话｜龙眼林"},
  {type:"clue",idx:3,desc:"礁石刻痕潮汐记录｜礁石滩"},
  {type:"clue",idx:4,desc:"旧渔网侨批封｜礁石滩"},
  {type:"clue",idx:5,desc:"囝仔信笺｜代书摊"},
  {type:"clue",idx:6,desc:"杉兄暗语｜代书摊"},
  {type:"clue",idx:7,desc:"目汁歌谣｜代书摊"},
];
const modalEl = document.getElementById("modal");
const mTitle = document.getElementById("mTitle");
const mBody = document.getElementById("mBody");
const mNav = document.getElementById("mNav");
const app = document.getElementById("app");
function save(){localStorage.setItem(SAVE_KEY,JSON.stringify(state))}
function load(){
  const raw = localStorage.getItem(SAVE_KEY);
  if(raw) Object.assign(state,JSON.parse(raw));
}
function getClueCount(){return state.clues.filter(x=>x).length}
function openModal(){modalEl.classList.add("open")}
function closeModal(){modalEl.classList.remove("open")}
function render(){
  const cnt = getClueCount();
  app.innerHTML = "";
  if(state.page==="home"){
    app.innerHTML = `
      <div class="home-page">
        <div class="home-title">乡音探事</div>
        <div class="home-slogan">一纸侨批，山海乡音</div>
        <div class="home-desc">闽南侨乡研学解谜小游戏，跟随侨批，探寻番客下南洋的往事。收集线索，解锁词汇，完成卷宗推理。</div>
      </div>
    `;
  }else if(state.page==="scene"){
    const s = scenes[state.sceneIdx];
    let html = `<div class="panel scene"><div class="scene-title">${s.title}</div><div class="scene-desc">${s.desc.replace(/\n/g,"<br>")}</div>`;
    if(s.points.length>0){
      html += `<div class="point-list">`;
      s.points.forEach(p=>{
        const lock = state.clues[p.idx];
        html += `
          <div class="point-item ${lock?'locked':''}" data-pidx="${p.idx}">
            <div class="point-name">${p.name} ${lock?"✅已解锁":"✨可探索"}</div>
            <div class="point-text">${lock?"这条线索已经解锁。":"点击开启考题"}</div>
          </div>
        `;
      });
      html += `</div>`;
    }
    html += `<div class="nav-row">`;
    s.nav.forEach(n=>{
      if(n.next==="paper"){
        html += `<button class="btn" ${cnt>=8?"":"disabled"} data-next="paper">${n.txt}</button>`;
      }else{
        html += `<button class="btn" data-next="${n.next}">${n.txt}</button>`;
      }
    });
    html += `</div>`;
    if(s.tip) html += `<div class="foot-tip">💡提示：${s.tip}</div>`;
    html += `</div>`;
    app.innerHTML = html;
    app.querySelectorAll(".point-item").forEach(el=>{
      el.onclick = ()=>{
        const pid = +el.dataset.pidx;
        if(state.clues[pid]) return;
        openQuiz(pid);
      }
    });
    app.querySelectorAll(".btn[data-next]").forEach(el=>{
      el.onclick = ()=>{
        const v = el.dataset.next;
        if(v==="paper"){
          if(cnt>=8){openPaper()}else alert("线索不足，暂时无法打开卷宗");
        }else{
          state.page="scene";state.sceneIdx=+v;save();render();
        }
      }
    })
  }else if(state.page==="word"){
    let html = `<div class="panel"><div class="panel-title">词库</div>`;
    wordList.forEach(w=>{
      const ok = state.clues[w.idx];
      html += `<div class="word-item ${ok?"":"locked"}">`;
      if(ok){html += `<div class="word-title">${w.text}</div>`;}else{html += `<div>？？？尚未解锁</div>`}
      html += `</div>`;
    })
    html += `</div>`;
    app.innerHTML = html;
  }else if(state.page==="unlock"){
    let html = `<div class="panel"><div class="panel-title">未解锁清单</div>`;
    html += `<div class="unlock-group"><h4>未解锁线索</h4>`;
    unlockMeta.forEach(u=>{
      if(!state.clues[u.idx]) html += `<div class="unlock-item">• ${u.desc}</div>`
    })
    html += `</div></div>`;
    app.innerHTML = html;
  }else if(state.page==="cert"){
    app.innerHTML = `
    <div class="panel cert">
      <h2>🏅 乡音探事 · 侨乡调查证</h2>
      <div style="margin:14px 0">调查员：<input id="nameInput" value="${state.playerName}" placeholder="填写名字"></div>
      <div class="cert-stamp">侨批研学<br>纪念章</div>
      <p>你串联全部线索，读懂番客阿发的侨批故事。一纸侨批，承载跨越山海的思念。</p>
      <p>✨成就解锁：识乡音，解侨批</p>
      <div class="nav-row" style="justify-content:center">
        <button class="btn" id="saveName">保存名字</button>
        <button class="btn btn-secondary" id="resetAll">重新开始调查</button>
      </div>
    </div>`;
    document.getElementById("saveName").onclick = ()=>{
      state.playerName = document.getElementById("nameInput").value;
      save();alert("名字已保存");
    }
    document.getElementById("resetAll").onclick = ()=>{
      if(confirm("确定重置全部进度？")){
        state.page="home";state.sceneIdx=0;state.clues=Array(8).fill(false);state.wrongCount=0;state.playerName="";save();render();
      }
    }
  }
}
function openQuiz(pid){
  const allPts = scenes.flatMap(s=>s.points||[]);
  const p = allPts.find(x=>x.idx===pid);
  mTitle.innerText = p.q;
  let optHtml = "";
  p.opts.forEach((o,i)=>optHtml += `<div class="opt-item" data-ans="${i}">${o}</div>`);
  mBody.innerHTML = optHtml;
  mNav.innerHTML = `<button class="btn" id="closeQuiz">关闭</button>`;
  openModal();
  document.querySelectorAll(".opt-item").forEach(el=>{
    el.onclick = ()=>{
      const sel = +el.dataset.ans;
      document.querySelectorAll(".opt-item").forEach(e=>e.classList.remove("correct","wrong"));
      if(sel===p.ans){
        el.classList.add("correct");
        state.clues[pid]=true;save();
        setTimeout(()=>{closeModal();render();},800);
      }else{
        el.classList.add("wrong");
      }
    }
  })
  document.getElementById("closeQuiz").onclick = closeModal;
}
function openPaper(){
  state.wrongCount=0;
  mTitle.innerText = "卷宗｜推理提交";
  mBody.innerHTML = `
    <div class="tip-text">集齐全部线索，请选出这段故事的真相。</div>
    <div class="opt-item" data-opt="0">A. 名叫阿发的番客远赴南洋趁食，不识字，请代书先生写侨批，用暗语寄银回家；妻子带着孩子在侨乡等候，在杂货店采买、龙眼林闲谈、礁石滩等船。</div>
    <div class="opt-item" data-opt="1">B. 杂货店主出海捕鱼，靠礁石记号记录鱼群，请代书先生记账。</div>
    <div class="opt-item" data-opt="2">C. 代书先生收集歌谣，记录闽南词语，整理成书。</div>
  `;
  mNav.innerHTML = `<button class="btn" id="closePaper">暂时离开卷宗</button>`;
  openModal();
  document.querySelectorAll(".opt-item").forEach(el=>{
    el.onclick = ()=>{
      const sel = +el.dataset.opt;
      if(sel===0){
        closeModal();state.page="cert";save();render();
      }else{
        state.wrongCount++;
        let tip="";
        if(state.wrongCount===1) tip="你的推论和线索对不上。想一想：侨批里的银钱是谁寄的、寄给谁？";
        else if(state.wrongCount===2) tip="梳理线索：线索里有南洋谋生、寄钱、家中妻儿等候，试着把人物串起来。";
        else tip="💡重点：南洋番客阿发托人写侨批寄钱，家人留在故乡等候。";
        mBody.innerHTML = `<div class="tip-text">${tip}</div>`;
      }
      save();
    }
  })
  document.getElementById("closePaper").onclick = closeModal;
}
// 导航按钮
document.getElementById("btnShop").onclick = ()=>alert("商店模块开发中，敬请期待！");
document.getElementById("btnWord").onclick = ()=>{state.page="word";save();render()};
document.getElementById("btnStart").onclick = ()=>{
  if(getClueCount()>0){
    if(confirm("是否继续上次调查？取消则回到首页")){
      state.page="scene";save();render();
    }
  }else{
    state.page="scene";state.sceneIdx=0;save();render();
  }
};
document.getElementById("btnPaper").onclick = ()=>{
  if(getClueCount()>=8){openPaper()}else{alert(`当前线索：${getClueCount()}/8，线索不足，无法打开卷宗`)}
};
document.getElementById("btnUnlock").onclick = ()=>{state.page="unlock";save();render()};
load();render();
</script>
